version: "3.9"

networks:
  pipeline-net:
    driver: bridge

volumes:
  mongo-data:

services:

  # ─────────────────────────────────────────
  # ZOOKEEPER – Kafka cluster coordinator
  # ─────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    networks:
      - pipeline-net
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # KAFKA BROKER
  # ─────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    networks:
      - pipeline-net
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ─────────────────────────────────────────
  # KAFKA TOPIC INITIALIZER
  # ─────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-init
    networks:
      - pipeline-net
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command: |
      "
      kafka-topics --create --if-not-exists \
        --bootstrap-server kafka:29092 \
        --replication-factor 1 \
        --partitions 3 \
        --topic transactions
      echo 'Topic [transactions] created.'
      "
  #AKHQ
  akhq:
    image: tchiotludo/akhq
    networks:
      - pipeline-net
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            local-kafka:
              properties:
                bootstrap.servers: "kafka:29092"
  # ─────────────────────────────────────────
  # MONGODB
  # ─────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    networks:
      - pipeline-net
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo-init/init.js:/docker-entrypoint-initdb.d/init.js:ro
    environment:
      MONGO_INITDB_DATABASE: transactions_db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # SOURCE 2 – Mockoon mock API + FastAPI producer
  # ─────────────────────────────────────────
  source2:
    build:
      context: ./source2
    container_name: source2
    networks:
      - pipeline-net
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: transactions
      SOURCE_NAME: source2
      PRODUCE_INTERVAL_SEC: "2"
    ports:
      - "8001:8000"
    restart: unless-stopped

  # ─────────────────────────────────────────
  # SOURCE 1 – Faker generator + FastAPI producer
  # ─────────────────────────────────────────
  source1:
    build:
      context: ./source1
    container_name: source1
    networks:
      - pipeline-net
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: transactions
      SOURCE_NAME: source1
      PRODUCE_INTERVAL_SEC: "3"
    ports:
      - "8002:8000"
    restart: unless-stopped

  # ─────────────────────────────────────────
  # KAFKA CONSUMER → MongoDB writer
  # ─────────────────────────────────────────
  kafka-consumer:
    build:
      context: ./kafka-consumer
    container_name: kafka-consumer
    networks:
      - pipeline-net
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC: transactions
      KAFKA_GROUP_ID: mongo-writer-group
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: transactions_db
      MONGO_COLLECTION: transactions
    restart: unless-stopped

  # ─────────────────────────────────────────
  # DASHBOARD – FastAPI backend + Chart.js frontend
  # ─────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
    container_name: dashboard
    networks:
      - pipeline-net
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: transactions_db
      MONGO_COLLECTION: transactions
    ports:
      - "3030:3030"
    restart: unless-stopped